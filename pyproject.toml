[project]
name = "zonetrade-sdk"
version = "0.1.0"
description = "Python SDK for Zonetrade Bot Platform — SMC trading signals via WebSocket"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zonetrade Team", email = "dev@zonetrade.app" }]
keywords = ["trading", "smc", "ict", "websocket", "bot", "binance", "bybit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "websockets>=12.0,<13",
    "pydantic>=2.0,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://zonetrade.app"
Documentation = "https://github.com/zonetradeapp/zonetrade-sdk/blob/main/claude.md"
Repository = "https://github.com/zonetradeapp/zonetrade-sdk"
Issues = "https://github.com/zonetradeapp/zonetrade-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zonetrade_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
